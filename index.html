<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="contenedor">
    <h1>Calculadora de IMC</h1>

    <div class="formulario">
      <label for="peso">Peso en kilogramos</label>
      <input type="number" id="peso" placeholder="Ej. 70" step="any">

      <label for="estatura">Estatura en metros</label>
      <input type="number" id="estatura" placeholder="Ej. 1.70" step="any">

      <button id="calcular">Calcular IMC</button>
      <p id="resultado"></p>
    </div>

    <h2>Tabla de IMC</h2>
    <table>
      <thead>
        <tr>
          <th>IMC</th>
          <th>Clasificación</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Menos de 18.5</td><td>Bajo peso</td></tr>
        <tr><td>18.5 – 24.9</td><td>Peso normal</td></tr>
        <tr><td>25 – 29.9</td><td>Sobrepeso</td></tr>
        <tr><td>30 o más</td><td>Obesidad</td></tr>
      </tbody>
    </table>
  </main>
  <script src="script.js"></script>
</body>
</html>
